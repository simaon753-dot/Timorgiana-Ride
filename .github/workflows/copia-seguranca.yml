# Cópia de segurança diária da base de dados.
#
# O que está aqui dentro deixou de ser informação e passou a ser dinheiro:
# quem pagou, quanto, e quantos dias comprou e ainda não usou. Se a base se
# perder, perde-se o registo de quem pagou — e quem tinha vinte dias fica
# com zero, sem prova do lado dele nem do nosso.
#
# Também guarda as cartas de condução e as fotografias de identificação dos
# motoristas. Perdê-las é pedir a toda a gente que se registe outra vez.
#
# ═══════════════════════════════════════════════════════════════════
# A CÓPIA VAI CIFRADA, E NÃO É ZELO A MAIS
#
# O ficheiro é guardado como artefacto do GitHub. Num repositório público,
# quem vê o repositório vê os artefactos — e isto tem nomes, telemóveis e
# documentos de identificação de pessoas reais.
#
# Cifrada, o artefacto é um bloco inútil sem a senha. A senha vive nos
# segredos do GitHub e nunca aparece no registo de execução.
#
# CONSEQUÊNCIA: perder a senha é perder as cópias todas. Guarda-a onde
# guardas as coisas que não podes perder.
# ═══════════════════════════════════════════════════════════════════

name: Cópia de segurança

on:
  schedule:
    # 17:00 UTC = 02:00 em Díli. A hora mais parada do dia.
    - cron: '0 17 * * *'
  # Para poder correr à mão quando fizer falta — antes de uma alteração
  # grande, por exemplo.
  workflow_dispatch:

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar o pg_dump certo
        # O Neon corre PostgreSQL 18. Um pg_dump mais antigo do que o
        # servidor RECUSA-SE a trabalhar — não avisa, falha. Por isso vem do
        # repositório oficial do PostgreSQL e não do que a Ubuntu traz.
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Copiar, comprimir e cifrar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENHA: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Falta o segredo DATABASE_URL"; exit 1; }
          test -n "$SENHA" || { echo "Falta o segredo BACKUP_PASSPHRASE"; exit 1; }

          NOME="timorgianaride-$(date -u +%Y-%m-%d).sql.gz.enc"
          echo "NOME=$NOME" >> "$GITHUB_ENV"

          pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip -9 \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:SENHA \
            > "$NOME"

          echo "Tamanho: $(du -h "$NOME" | cut -f1)"

      - name: Confirmar que a cópia não está vazia
        # Uma cópia de segurança que falha em silêncio é pior do que não ter
        # nenhuma: dá a sensação de estar protegido. Se o ficheiro sair
        # pequeno demais, alguma coisa correu mal e é melhor saber hoje do
        # que no dia em que for preciso restaurar.
        run: |
          set -euo pipefail
          BYTES=$(stat -c%s "$NOME")
          echo "Bytes: $BYTES"
          if [ "$BYTES" -lt 10240 ]; then
            echo "A cópia tem menos de 10 KB. Não pode estar certa."
            exit 1
          fi

      - name: Guardar
        uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_number }}
          path: ${{ env.NOME }}
          # Noventa dias é o máximo do plano gratuito. Para guardar mais
          # tempo, descarrega uma de vez em quando para um disco teu.
          retention-days: 90
          compression-level: 0 # já vem comprimido e cifrado
