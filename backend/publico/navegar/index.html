<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0E5C54" />
    <title>Navegar · TimorgianaRide</title>
    <link rel="stylesheet" href="/navegar/vendor/maplibre-6.10.0/maplibre-gl.css" />
    <style>
      /* As cores da marca (design/SISTEMA.md da app): teal #0E5C54 com texto
         claro, coral #FF6B4A com texto ESCURO (branco sobre coral fica a 2,8:1). */
      :root {
        --teal: #0e5c54;
        --teal-escuro: #0a463f;
        --coral: #ff6b4a;
        --sobre-coral: #22100a;
        --papel: #f7f4ef;
        --texto: #1c2421;
        --mudo: #68726c;
        --fio: #e2ddd4;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--papel); color: var(--texto);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
      #mapa { position: absolute; inset: 0; }
      button { font: inherit; cursor: pointer; }

      /* A INSTRUÇÃO, em cima: a seta, a distância e o que fazer. Grande, para
         se ler de relance com o telemóvel preso no tablier. */
      #faixa { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 14px; background: var(--teal); color: #fff;
        display: none; align-items: center; gap: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
      #faixa.visivel { display: flex; }
      #seta { width: 56px; height: 56px; flex: none; }
      #faixaTextos { min-width: 0; }
      #faixaDist { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
      #faixaTexto { font-size: 18px; font-weight: 600; line-height: 1.25; margin-top: 2px;
        overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

      /* O ESTADO (GPS, a calcular, desvio), por baixo da faixa. */
      #estado { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3;
        top: calc(env(safe-area-inset-top) + 110px); background: rgba(28,36,33,.88); color: #fff;
        padding: 8px 14px; border-radius: 999px; font-size: 15px; display: none; max-width: 92vw; text-align: center; }
      #estado.visivel { display: block; }

      /* EM BAIXO: quanto falta e a que horas se chega, e os botões. */
      #barra { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: #fff;
        padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); display: none; align-items: center; gap: 10px;
        border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -2px 12px rgba(0,0,0,.18); }
      #barra.visivel { display: flex; }
      #resumo { flex: 1; min-width: 0; }
      #resumoTempo { font-size: 22px; font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; }
      #resumoResto { font-size: 14px; color: var(--mudo); margin-top: 2px; }
      .redondo { width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid var(--fio); background: #fff;
        display: flex; align-items: center; justify-content: center; flex: none; }
      .redondo[aria-pressed="false"] { opacity: .45; }
      #sair { border-color: #f1c9bf; }

      #recentrar { position: absolute; right: 16px; z-index: 3; bottom: calc(env(safe-area-inset-bottom) + 96px);
        display: none; background: #fff; border: none; border-radius: 999px; padding: 12px 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,.25); font-weight: 700; color: var(--teal); }
      #recentrar.visivel { display: block; }

      /* O INÍCIO: para onde se vai, e o toque que liga a voz e o ecrã. Os
         navegadores só deixam falar e manter o ecrã ligado depois de um toque. */
      #inicio { position: absolute; inset: 0; z-index: 5; background: rgba(247,244,239,.97);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px); }
      #inicio.escondido { display: none; }
      #inicioMarca { color: var(--teal); font-weight: 800; letter-spacing: .02em; font-size: 14px; text-transform: uppercase; }
      #inicioTitulo { font-size: 28px; font-weight: 800; margin: 6px 0 4px; line-height: 1.15; }
      #inicioNota { color: var(--mudo); font-size: 15px; line-height: 1.4; margin: 8px 0 20px; }
      #comecar { min-height: 60px; border: none; border-radius: 20px; background: var(--coral); color: var(--sobre-coral);
        font-size: 19px; font-weight: 800; }
      #comecar:disabled { opacity: .45; }
      #erroInicio { color: #c0392b; margin-top: 12px; font-size: 15px; min-height: 1em; }

      .maplibregl-ctrl-attrib { font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="mapa" role="application" aria-label="Mapa"></div>

    <div id="faixa" aria-live="polite">
      <svg id="seta" viewBox="0 0 56 56" aria-hidden="true"></svg>
      <div id="faixaTextos">
        <div id="faixaDist"></div>
        <div id="faixaTexto"></div>
      </div>
    </div>
    <div id="estado" role="status"></div>
    <button id="recentrar" type="button"></button>

    <div id="barra">
      <div id="resumo">
        <div id="resumoTempo"></div>
        <div id="resumoResto"></div>
      </div>
      <button id="voz" class="redondo" type="button" aria-pressed="true"></button>
      <button id="geral" class="redondo" type="button"></button>
      <button id="sair" class="redondo" type="button"></button>
    </div>

    <div id="inicio">
      <div id="inicioMarca">TimorgianaRide</div>
      <div id="inicioTitulo"></div>
      <div id="inicioNota"></div>
      <button id="comecar" type="button"></button>
      <div id="erroInicio" role="alert"></div>
    </div>

    <script type="module" src="/navegar/app.js"></script>
  </body>
</html>
